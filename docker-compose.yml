# 本地开发依赖：MySQL 8.4 + Redis（供 apps/backend 使用）
# 启动：docker-compose up -d
# 停止：docker-compose down（数据保留在 mysql-data / redis-data 卷）
services:
  mysql:
    image: mysql:8.4
    container_name: knowledge-share-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chenjiang
      MYSQL_DATABASE: knowledge_share
      MYSQL_USER: chenjiang
      MYSQL_PASSWORD: chenjiang
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: knowledge-share-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - '60'
      - '1'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
  redis-data:
