# /etc/nginx/conf.d/knowledge-share.conf
#
# 生产约定：
#   官网 + 报名页  : 对外 http://服务器IP:8888/  -> 127.0.0.1:3000
#   管理后台       : 仅本机 127.0.0.1:8080      -> apps/web/dist
#   后端 API       : 仅本机 127.0.0.1:3001
#
# 管理后台默认只监听回环地址，不对外暴露。
# 本机访问后台：
#   ssh -L 8080:127.0.0.1:8080 root@服务器IP
#   浏览器打开 http://localhost:8080
#
# 如果确实要临时从公网 IP:8080 访问后台：
#   1. 把下面后台 server 的 listen 改成 listen 8080;
#   2. 阿里云安全组放行 8080；
#   3. 用完再关闭安全组规则。

# -------------------------------------------------------------------
# 官网 + 报名页：对外 8888
# -------------------------------------------------------------------
server {
    listen 8888 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js 静态资源，长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 官网和报名页共用的后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # 关闭缓冲，避免 AI/SSE 类接口被 Nginx 攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后端上传的图片、海报等静态文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public";
    }

    # 其余全部交给 Next.js 官网服务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300s;
    }
}

# -------------------------------------------------------------------
# 管理后台：只监听本机 8080，通过 SSH 隧道访问
# -------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /srv/knowledge-share/apps/web/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 30m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 入口 HTML 不缓存，避免发版后仍加载旧版本
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Vite 构建出的 JS/CSS/字体等资源
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 管理后台接口
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传文件由后端提供
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
