<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f5f7" />
    <title>研途 · 微信小程序原型</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5f5f7;
        --ink: #1d1d1f;
        --blue: #0066cc;
        --muted: #5f5f65;
        --line: #e1e1e6;
        --white: #ffffff;
        --blue-soft: #e8f2ff;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #ededf0;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .app {
        width: min(100%, 460px);
        min-height: 100dvh;
        margin: auto;
        background: var(--paper);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 24px 13px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: var(--ink);
        color: white;
      }
      .prototype {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.09em;
      }
      main {
        flex: 1;
        padding: 12px 24px 28px;
      }
      .intro {
        display: grid;
        gap: 8px;
        margin-bottom: 22px;
      }
      h1 {
        font-family: 'Songti SC', 'Noto Serif CJK SC', 'SimSun', serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.17;
      }
      h2 {
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 17px;
        line-height: 1.45;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .seg {
        display: flex;
        gap: 4px;
        width: max-content;
        max-width: 100%;
        border: 1px solid var(--line);
        padding: 3px;
        border-radius: 11px;
        background: #eaeaec;
        margin-bottom: 15px;
      }
      .seg button {
        border: 0;
        background: transparent;
        padding: 7px 12px;
        border-radius: 8px;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }
      .seg button[aria-pressed='true'] {
        background: var(--white);
        color: var(--blue);
        font-weight: 700;
        box-shadow: 0 1px 3px #1d1d1f16;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .metric {
        min-width: 0;
        text-align: left;
        border: 1px solid var(--line);
        background: var(--white);
        border-radius: 15px;
        padding: 13px;
        display: grid;
        gap: 6px;
      }
      .metric-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .metric strong {
        font-size: 30px;
        font-weight: 750;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 24px 0 10px;
      }
      .text-button {
        border: 0;
        background: transparent;
        color: var(--blue);
        padding: 6px 0;
        font-size: 13px;
        font-weight: 700;
      }
      .hero {
        background:
          linear-gradient(90deg, #111114f0, #1d1d1f8c),
          var(--campus) center 54% / cover;
        background-color: #28282b;
        color: #fff;
        padding: 20px;
        border-radius: 19px;
        display: grid;
        gap: 9px;
      }
      .hero h3 {
        max-width: 20ch;
        font-size: 24px;
        line-height: 1.3;
        font-family: 'Songti SC', 'Noto Serif CJK SC', 'SimSun', serif;
      }
      .hero .muted {
        color: #f5f5f7;
      }
      .badge {
        width: max-content;
        border-radius: 999px;
        background: #f5f5f7;
        color: #29292d;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: max-content;
        min-height: 38px;
        padding: 8px 13px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: var(--blue);
        color: white;
        font-size: 13px;
        font-weight: 650;
      }
      .button.light {
        background: var(--white);
        color: var(--blue);
        margin-top: 2px;
      }
      .button.secondary {
        background: var(--white);
        border-color: var(--line);
        color: var(--blue);
      }
      .stack {
        display: grid;
        gap: 9px;
      }
      .card,
      .row {
        border: 1px solid var(--line);
        background: var(--white);
        border-radius: 15px;
        padding: 15px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: 100%;
        text-align: left;
      }
      .row:hover,
      .metric:hover {
        border-color: #b6b6bf;
      }
      .row-main {
        display: grid;
        gap: 4px;
      }
      .date {
        min-width: 45px;
        font-size: 13px;
        font-weight: 750;
        color: var(--blue);
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .feature {
        height: 144px;
        border-radius: 14px;
        background: var(--campus) center/cover;
        margin-bottom: 12px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--paper);
        color: var(--ink);
        font-weight: 750;
      }
      nav {
        position: sticky;
        z-index: 2;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        background: var(--white);
        border-top: 1px solid var(--line);
        padding: 5px 12px max(6px, env(safe-area-inset-bottom));
      }
      nav button {
        border: 0;
        background: none;
        min-height: 48px;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      nav [aria-current='page'] {
        color: var(--blue);
        font-weight: 800;
      }
      .nav-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 24px;
        border-radius: 8px;
      }
      nav [aria-current='page'] .nav-icon {
        background: var(--blue-soft);
      }
      svg {
        width: 17px;
        height: 17px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
        width: min(calc(100% - 32px), 412px);
        max-height: 85dvh;
        color: var(--ink);
        background: var(--white);
      }
      dialog::backdrop {
        background: #1d1d1f80;
      }
      .dialog-top,
      .actions {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }
      .dialog-top {
        justify-content: space-between;
        margin-bottom: 15px;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        font-size: 20px;
      }
      .field {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 700;
      }
      .field input {
        border: 1px solid var(--line);
        padding: 10px;
        border-radius: 8px;
        width: 100%;
        font-weight: 400;
      }
      .poster {
        min-height: 220px;
        align-content: space-between;
      }
      .code-slot {
        justify-self: end;
        display: grid;
        place-items: center;
        text-align: center;
        width: 74px;
        height: 74px;
        border: 1px dashed #fff;
        border-radius: 7px;
        font-size: 11px;
      }
      .toast {
        position: fixed;
        bottom: 78px;
        left: 50%;
        translate: -50%;
        background: #29292d;
        color: #fff;
        border-radius: 8px;
        padding: 9px 15px;
        z-index: 5;
        font-size: 13px;
      }
      .toast:empty {
        display: none;
      }
      @media (min-width: 560px) {
        .app {
          min-height: min(860px, calc(100dvh - 40px));
          margin: 20px auto;
          border-radius: 25px;
          box-shadow: 0 20px 70px #1d1d1f18;
          border: 1px solid #dedee3;
        }
        nav {
          border-radius: 0 0 25px 25px;
        }
      }
      @media (max-width: 365px) {
        main,
        header {
          padding-inline: 16px;
        }
      }
    </style>

  <body>
    <div class="app">
      <header>
        <div class="brand">
          <span class="brand-mark" id="mark" aria-hidden="true"></span>研途
        </div>
        <span class="prototype">小程序预览</span>
      </header>
      <main id="page"></main>
      <nav id="nav" aria-label="底部导航"></nav>
    </div>
    <dialog id="sheet" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status"></div>
    <script>
      const paths = {
        chart: '<path d="M4 4v16h16M8 15v-3m4 3V9m4 6V6"/>',
        calendar:
          '<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 4v4m8-4v4M4 11h16"/>',
        book: '<path d="M12 6v14M3 5c4-1 6 0 9 2 3-2 5-3 9-2v13c-4-1-6 0-9 2-3-2-5-3-9-2z"/>',
        user: '<circle cx="12" cy="8" r="3"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/>',
        right: '<path d="m9 6 6 6-6 6"/>',
        trend: '<path d="m5 16 5-5 4 3 5-7m-5 0h5v5"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        link: '<path d="m10 13 4-4m-6 7-1 1a3 3 0 0 1-4-4l4-4a3 3 0 0 1 4 0m2 6a3 3 0 0 0 4 0l4-4a3 3 0 0 0-4-4l-1 1"/>',
      }
      const icon = (name) =>
        `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`
      const screens = [
        ['statistics', '统计', 'chart'],
        ['activities', '活动', 'calendar'],
        ['knowledge', '知识分享', 'book'],
        ['mine', '我的', 'user'],
      ]
      const events = [
        {
          id: 'interview',
          title: '保研面试，从准备到复盘',
          speaker: '林晓',
          date: '11月28日',
          short: '11.28',
          state: '报名中',
          desc: '从自我介绍、英文问答到追问应对，拆解保研面试的常见题型与准备方法。',
        },
        {
          id: 'camp',
          title: '夏令营选校与材料准备',
          speaker: '陈予安',
          date: '12月05日',
          short: '12.05',
          state: '报名中',
          desc: '梳理选校方向、申请材料和投递顺序。',
        },
        {
          id: 'portfolio',
          title: '从科研经历到个人陈述',
          speaker: '许知远',
          date: '11月21日',
          short: '11.21',
          state: '已结束',
          desc: '从一个科研项目出发，梳理个人贡献和面试讲述结构。',
        },
      ]
      const articles = [
        [
          '面试经验',
          '11月26日',
          '如何准备一段能被追问的自我介绍',
          '把经历整理成问题、行动和结果，给每段经历预留一个可以展开的细节。',
        ],
        [
          '夏令营',
          '11月24日',
          '夏令营申请材料清单',
          '提前整理成绩单、排名证明、个人陈述和代表性成果，再按院校要求逐项核对。',
        ],
        [
          '预推免',
          '11月22日',
          '预推免投递时间线',
          '用一张表记录院校的报名、初审、面试和确认时间，为可能冲突的面试安排留出空间。',
        ],
      ]
      const metrics = [
        ['我的报名', 'calendar'],
        ['我的签到', 'check'],
        ['海报访问', 'link'],
        ['分享报名', 'trend'],
      ]
      const ranges = ['本周', '本月', '全部']
      const sampleCounts = [
        [0, 0, 32, 8],
        [1, 1, 96, 23],
        [3, 2, 182, 41],
      ]
      const page = document.getElementById('page')
      const nav = document.getElementById('nav')
      const sheet = document.getElementById('sheet')
      const records = new Set()
      const checkIns = new Set()
      const upcoming = events[0]
      let screen = 'statistics'
      let range = 0
      let activityFilter = '近期活动'
      let topic = '全部'
      let channel = '小程序内查看'
      let toastTimer

      document.getElementById('mark').innerHTML = icon('book')
      const button = (label, action, id = '', tone = '') =>
        `<button class="button ${tone}" data-action="${action}" data-id="${id}">${label}</button>`
      const row = (title, detail, action, id = '', date = '') =>
        `<button class="row" data-action="${action}" data-id="${id}">${date ? `<span class="date">${date}</span>` : ''}<span class="row-main grow"><strong>${title}</strong><span class="muted">${detail}</span></span>${icon('right')}</button>`
      const segment = (items, selected, action) =>
        `<div class="seg" role="group" aria-label="筛选">${items.map((item, index) => `<button data-action="${action}" data-id="${index}" aria-pressed="${item === selected}">${item}</button>`).join('')}</div>`
      const intro = (title, subtitle) =>
        `<div class="intro"><h1>${title}</h1><p class="muted">${subtitle}</p></div>`
      const status = (event) =>
        checkIns.has(event.id)
          ? '已签到'
          : records.has(event.id)
            ? '已报名'
            : event.state
      const eventRow = (event) =>
        row(
          event.title,
          `${event.speaker} · ${status(event)}`,
          'event',
          event.id,
          event.short
        )

      const views = {
        statistics: () => `${intro('统计', '查看你的活动参与和海报分享数据')}
          ${segment(ranges, ranges[range], 'range')}
          <div class="stats">${metrics.map(([name, symbol], i) => `<button class="metric" data-action="metric" data-id="${i}"><span class="metric-label">${name}${icon(symbol)}</span><strong>${sampleCounts[range][i] + (i === 0 ? records.size : i === 1 ? checkIns.size : 0)}</strong></button>`).join('')}</div>
          <div class="section-title"><h2>近期活动</h2><button class="text-button" data-action="tab" data-id="activities">查看全部 ›</button></div>
          <article class="hero"><span class="badge">${status(upcoming)}</span><h3>${upcoming.title}</h3><p class="muted">${upcoming.date} · 分享人 ${upcoming.speaker}</p>
          ${button(records.has(upcoming.id) ? '查看活动' : '立即报名', records.has(upcoming.id) ? 'event' : 'join', upcoming.id, 'light')}</article>`,
        activities: () => `${intro('活动', '查看近期安排与往期回顾')}
          ${segment(['近期活动', '往期活动'], activityFilter, 'activity-filter')}
          <div class="stack">${events
            .filter(
              (event) =>
                (event.state === '已结束') === (activityFilter === '往期活动')
            )
            .map(eventRow)
            .join('')}</div>`,
        knowledge:
          () => `${intro('知识分享', '阅读保研经验、申请攻略与面试准备')}
          ${segment(['全部', '夏令营', '预推免', '面试经验'], topic, 'topic')}
          <div class="stack">${articles.map(([tag, date, title, summary], index) => (tag === topic || topic === '全部' ? `${index === 0 ? '<div class="feature" role="img" aria-label="校园风景"></div>' : ''}${row(title, `${tag} · ${date} · ${summary}`, 'article', index)}` : '')).join('')}</div>`,
        mine: () => `${intro('我的', '管理报名、分享和内容接收偏好')}
          <div class="card row"><span class="avatar">研</span><span class="row-main grow"><strong>体验账号</strong><span class="muted">微信小程序原型</span></span></div>
          <div class="section-title"><h2>个人记录</h2></div><div class="stack">
          ${row('我的报名', '查看报名和签到状态', 'metric', 0)}
          ${row('我的分享', '查看分享数据与活动海报', 'metric', 2)}
          ${row('我的佣金', '查看归因和结算记录', 'commissions')}
          ${row('内容接收设置', channel, 'settings')}</div>`,
      }

      function render() {
        page.innerHTML = views[screen]()
        nav.innerHTML = screens
          .map(
            ([key, name, symbol]) =>
              `<button data-action="tab" data-id="${key}" ${screen === key ? 'aria-current="page"' : ''}><span class="nav-icon">${icon(symbol)}</span>${name}</button>`
          )
          .join('')
      }

      function openSheet(title, content) {
        sheet.innerHTML = `<div class="dialog-top"><h2 id="dialog-title">${title}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div>${content}`
        if (!sheet.open) sheet.showModal()
        sheet.querySelector('.close').focus()
        sheet.scrollTop = 0
      }

      function notify(message) {
        const toast = document.getElementById('toast')
        toast.textContent = message
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => {
          toast.textContent = ''
        }, 2200)
      }

      function showEvent(event) {
        openSheet(
          event.title,
          `<div class="stack"><p class="muted">${event.date} · 分享人 ${event.speaker} · ${status(event)}</p><p class="muted">${event.desc}</p>
          <div class="actions">${event.state === '已结束' ? '' : checkIns.has(event.id) ? '<strong>签到成功</strong>' : records.has(event.id) ? button('模拟签到', 'check-in', event.id) : button('立即报名', 'join', event.id)}
          ${button('制作海报', 'poster', event.id, 'secondary')}</div></div>`
        )
      }

      function showJoin(event) {
        if (records.has(event.id) || event.state === '已结束') {
          showEvent(event)
          return
        }
        openSheet(
          '报名参加',
          `<form class="stack" id="registration" data-id="${event.id}">
          <h3>${event.title}</h3><p class="muted">${event.speaker} · ${event.date} · 体验时请使用模拟信息</p>
          <label class="field">姓名<input name="name" required maxlength="30" placeholder="输入姓名"></label>
          <label class="field">手机号<input name="phone" type="tel" inputmode="numeric" required pattern="1[0-9]{10}" maxlength="11" placeholder="输入 11 位手机号"></label>
          <button class="button" type="submit">提交报名</button></form>`
        )
      }

      function showMetric(index) {
        const personalEvents = events.filter((event) =>
          (index === 1 ? checkIns : records).has(event.id)
        )
        const content =
          index < 2
            ? personalEvents.map(eventRow).join('') ||
              '<p class="muted">本次预览还没有新增记录。你可以先到「活动」报名。</p>'
            : row(
                upcoming.title,
                `海报访问 ${sampleCounts[range][2]} 次 · 分享报名 ${sampleCounts[range][3]} 人`,
                'poster',
                upcoming.id
              )
        openSheet(
          metrics[index][0],
          `<div class="stack"><p class="muted">${ranges[range]} · 模拟统计</p>${content}</div>`
        )
      }

      function showPoster(event) {
        openSheet(
          '制作海报',
          `<div class="stack"><label class="field">海报标题<input id="poster-input" maxlength="80"></label>
          <article class="hero poster"><div class="stack"><h3 id="poster-title"></h3><p class="muted">分享人 ${event.speaker} · ${event.date}</p></div><span class="code-slot">小程序码<br>预留位置</span></article>
          ${button('预览报名页', 'join', event.id, 'secondary')}</div>`
        )
        const title = sheet.querySelector('#poster-title')
        const input = sheet.querySelector('#poster-input')
        input.value = event.title
        title.textContent = event.title
        input.addEventListener('input', () => {
          title.textContent = input.value.trim() || event.title
        })
      }

      document.addEventListener('click', (e) => {
        const control = e.target.closest('[data-action]')
        if (!control) return
        const { action, id } = control.dataset
        const event = events.find((item) => item.id === id)
        switch (action) {
          case 'tab':
            screen = id
            render()
            window.scrollTo(0, 0)
            break
          case 'range':
            range = Number(id)
            render()
            break
          case 'activity-filter':
            activityFilter = ['近期活动', '往期活动'][id]
            render()
            break
          case 'topic':
            topic = ['全部', '夏令营', '预推免', '面试经验'][id]
            render()
            break
          case 'close':
            sheet.close()
            break
          case 'event':
            showEvent(event)
            break
          case 'join':
            showJoin(event)
            break
          case 'check-in':
            checkIns.add(id)
            render()
            showEvent(event)
            notify('签到成功')
            break
          case 'metric':
            showMetric(Number(id))
            break
          case 'poster':
            showPoster(event)
            break
          case 'article': {
            const [tag, date, title, summary] = articles[id]
            openSheet(
              title,
              `<div class="stack"><p class="muted">${tag} · ${date}</p><p>${summary}</p></div>`
            )
            break
          }
          case 'commissions':
            openSheet('我的佣金', '<p class="muted">暂无结算记录。</p>')
            break
          case 'settings':
            openSheet(
              '内容接收设置',
              `<p class="muted">当前选择 · ${channel}</p><div class="actions">${button('小程序内查看', 'channel', 0, 'secondary')}${button('微信公众号', 'channel', 1, 'secondary')}</div>`
            )
            break
          case 'channel':
            channel = ['小程序内查看', '微信公众号'][id]
            sheet.close()
            render()
            notify('偏好已更新')
            break
        }
        if (['range', 'activity-filter', 'topic'].includes(action)) {
          page
            .querySelector(`[data-action="${action}"][data-id="${id}"]`)
            ?.focus()
        }
      })

      sheet.addEventListener('submit', (e) => {
        e.preventDefault()
        const id = e.target.dataset.id
        if (!id) return
        records.add(id)
        render()
        openSheet(
          '报名成功',
          `<div class="stack"><p class="muted">已为你保留本场活动的报名记录。</p>${button('查看活动', 'event', id)}</div>`
        )
      })

      render()
    </script>
  </body>
</html>
